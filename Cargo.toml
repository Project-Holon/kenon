[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Project-Holon/kenon"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# The editor decodes and draws game data; unoptimised it is several times
# slower, so dev builds optimise kenon-core and dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.kenon-core]
opt-level = 3
