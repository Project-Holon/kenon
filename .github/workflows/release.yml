name: Release

# Builds the app for Windows, Linux and macOS and publishes it as a GitHub
# release. Runs when a version tag is pushed (v0.2.0), which must match the
# version in Cargo.toml, package.json and app/tauri.conf.json
# (node tools/set-version.mjs 0.2.0 sets all three).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        name: Versions agree with the tag
        run: |
          version=$(node tools/set-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        # A stuck mirror download must not hold the job for hours.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: kenon ${{ needs.version.outputs.version }}
          releaseBody: Builds for Windows (installer), Linux (AppImage, deb, rpm) and macOS (universal dmg). The builds are not signed.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Copies without the version in their names, so a link like
      # releases/latest/download/kenon-windows-setup.exe always works.
      - name: Version-less copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          mkdir -p plain
          echo "$PATHS" | jq -r '.[]' | while read -r f; do
            f="${f%$'\r'}"
            f="${f//\\//}"
            case "$f" in
              *-setup.exe) cp "$f" plain/kenon-windows-setup.exe ;;
              *.msi) cp "$f" plain/kenon-windows.msi ;;
              *.AppImage) cp "$f" plain/kenon-linux.AppImage ;;
              *.deb) cp "$f" plain/kenon-linux.deb ;;
              *.rpm) cp "$f" plain/kenon-linux.rpm ;;
              *.dmg) cp "$f" plain/kenon-macos.dmg ;;
            esac
          done
          ls plain
          gh release upload "$TAG" plain/* --clobber
